[package]
name = "lethe"
version = "0.8.3-dev"
edition = "2024"
rust-version = "1.99"
authors = ["Konstantin Alexandroff <k.alexandroff@gmail.com>"]
description = "A secure, free, cross-platform and open-source drive wiping utility"
homepage = "https://github.com/Kostassoid/lethe"
repository = "https://github.com/Kostassoid/lethe"
readme = "README.md"
license = "Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["security", "command-line", "disk", "erase", "storage"]

[dependencies]
anyhow = "1"
clap = "4.6"
console = "0.16"
indicatif = "0.18"
libc = "0.2"
plist = "1"
prettytable-rs = "0.10"
rand = "0.10"
rand_chacha = "0.10"
regex = "1"
roaring = "0.12"
serde = { version = "1", features = ["derive"] }
streaming-iterator = "0.1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["ioctl"] }
sysfs-class = "0.1"

[target.'cfg(windows)'.dependencies]
widestring = "1"
winapi = { version = "0.3", features = [
    "cguid",
    "commapi",
    "errhandlingapi",
    "fileapi",
    "guiddef",
    "handleapi",
    "ioapiset",
    "minwinbase",
    "minwindef",
    "ntdef",
    "processthreadsapi",
    "securitybaseapi",
    "setupapi",
    "winbase",
    "winerror",
    "winioctl",
    "winnt",
] }

[dev-dependencies]
assert_matches = "1.5"
flate2 = "1.1"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
