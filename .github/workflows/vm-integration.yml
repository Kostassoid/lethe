name: VM integration

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Space-separated test VMs (linux-x64, linux-arm64, windows-x64, windows-arm64)"
        required: true
        default: "linux-x64"
  schedule:
    # Weekly smoke test of the KVM-backed Linux x86-64 guest.
    - cron: "0 4 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guests:
    name: VM integration
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and Vagrant
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-utils wget gpg ca-certificates
          wget -O- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Install vagrant-qemu
        run: vagrant plugin install vagrant-qemu

      - name: Run guest tests
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux-x64' }}
        run: |
          set -euo pipefail
          for platform in $PLATFORMS; do
            echo "::group::${platform}"
            vagrant up "$platform" --provider=qemu
            if [[ "$platform" == linux-* ]]; then
              vagrant ssh "$platform" -c "cd ~/lethe && bash testing/run-tests.sh"
            else
              vagrant ssh "$platform" -c "powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/vagrant/lethe/testing/run-tests.ps1"
            fi
            vagrant destroy -f "$platform"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: vagrant destroy -f || true
